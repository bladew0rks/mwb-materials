name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish mwb-materials/mwb-materials.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwb-materials-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/

      - name: Package (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: tar -czf mwb-materials-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath mwb-materials-${{ matrix.rid }}.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mwb-materials-*.tar.gz
            mwb-materials-*.zip
